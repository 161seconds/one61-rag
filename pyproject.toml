[project]
name = "hkt-ai-service"
version = "0.1.0"
description = "Domain-Specific Agentic RAG System - Hackathon 2026"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # LLM
    "groq>=0.25.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "openai>=1.50.0",
    # RAG
    "lightrag-hku>=1.3.0",
    # Embedding
    "sentence-transformers>=3.4.0",
    "torch>=2.5.0",
    # Vector DB
    "qdrant-client>=1.13.0",
    # Postgres (shared DB)
    "asyncpg>=0.30.0",
    # Cache & Queue
    "redis[hiredis]>=5.2.0",
    "bullmq>=2.20.0",
    # Utils
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "numpy>=1.26.0",
    "langfuse>=4.2.0",
    # Document parsing
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
