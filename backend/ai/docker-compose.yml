name: ai-worker

services:
  # AI Service
  ai-service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://aqua_calendar:aqua_calendar@host.docker.internal:5979/aqua_calendar_db
      CALLBACK_URL: http://host.docker.internal:3002/conversations/ai/response
      BULLMQ_REDIS_HOST: host.docker.internal
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
